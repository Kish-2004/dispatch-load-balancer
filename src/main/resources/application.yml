spring:
  application:
    name: dispatch-load-balancer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatch_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mcd@123$}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
